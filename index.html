<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoLeads | Marketing Automotivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                300: '#86efac',
                400: '#4ade80',
                500: '#22c55e',
                600: '#16a34a', // Verde vibrante para botões
                700: '#15803d',
                800: '#166534',
                900: '#14532d',
                950: '#022c22', // Fundo principal
              },
              accent: {
                300: '#fde047',
                400: '#facc15', // Dourado para detalhes finos
                500: '#eab308',
                600: '#ca8a04',
                700: '#a16207',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'drive-fast': 'drive 3s linear infinite',
              'drive-slow': 'drive 8s linear infinite reverse',
              'pulse-gold': 'pulse-gold 2s infinite',
            },
            keyframes: {
              drive: {
                '0%': { transform: 'translateX(-100vw)' },
                '100%': { transform: 'translateX(100vw)' },
              },
              'pulse-gold': {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0.7 },
              },
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #022c22;
        color: white;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #022c22; 
      }
      ::-webkit-scrollbar-thumb {
        background: #166534; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #15803d; 
      }
      
      /* Botão Principal Verde (Brand) */
      .btn-primary {
        background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
        color: white;
        transition: 0.3s;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        box-shadow: 0 6px 20px rgba(22, 163, 74, 0.5);
        transform: translateY(-1px);
        border-color: rgba(250, 204, 21, 0.3); /* Detalhe dourado sutil no hover */
      }

      /* Botão Secundário (Outline) */
      .btn-outline {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        transition: 0.3s;
      }
      .btn-outline:hover {
        background: rgba(255,255,255,0.1);
        border-color: #16a34a;
      }

      /* ESTILOS DE IMPRESSÃO (PDF) */
      @media print {
        body {
          visibility: hidden;
          height: auto;
          overflow: visible;
        }

        #contract-print-area {
          visibility: visible;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          margin: 0;
          padding: 20px;
          background-color: white !important;
          color: black !important;
          font-family: 'Times New Roman', Times, serif;
          display: block;
        }

        #contract-print-area * {
          visibility: visible;
          color: black !important;
          text-shadow: none !important;
          background: transparent !important;
        }

        /* Reseta fundos e cores dos containers pais para não atrapalhar */
        #root, .min-h-screen, .bg-brand-950 {
          background: white !important;
          height: auto !important;
          min-height: auto !important;
          overflow: visible !important;
          display: block !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

  </body>
</html>
